name: Prepare source release draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing numeric version tag, for example v0.4.0
        required: true
        type: string
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -X utf8 -m unittest discover -s tests -p "test*.py" -v
      - run: python -X utf8 -m unittest discover -s tools -p "test*.py" -v
      - run: python -X utf8 tools/prepare_release.py
      - name: Build source archive
        env:
          BRIDGE_RELEASE_TAG: ${{ inputs.tag }}
        run: python -X utf8 tools/package_prerelease.py --tag "$env:BRIDGE_RELEASE_TAG" --out dist/check
  draft:
    needs: checks
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Prepare source-only draft
        env:
          BRIDGE_RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python -X utf8 tools/package_prerelease.py --tag "$env:BRIDGE_RELEASE_TAG" --out dist/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release create "$env:BRIDGE_RELEASE_TAG" dist/release/polytopia-agent-bridge-source.zip dist/release/polytopia-agent-bridge-source.zip.sha256 --draft --prerelease --latest=false --verify-tag --title "$env:BRIDGE_RELEASE_TAG - Polytopia Agent Bridge" --notes-file dist/release/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release download "$env:BRIDGE_RELEASE_TAG" --dir dist/downloaded --pattern 'polytopia-agent-bridge-source.zip*'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 tools/package_prerelease.py --tag "$env:BRIDGE_RELEASE_TAG" --verify-directory dist/downloaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
